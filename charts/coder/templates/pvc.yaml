{{ if .Values.calrissian.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calrissian-claim
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.calrissian.storage}}
  storageClassName: {{ .Values.calrissian.storageClassName}}
{{ end }}