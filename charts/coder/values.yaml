
coder:
  coderImage: ghcr.io/eoap/dev-platform-eoap/eoap-coder:0.1.0
  workspace: quickwin
  storageClassName: standard
  workspaceStorage: 20Gi
  securityContext:
    privileged: true
  serviceType: ClusterIP
  resources:
    limits:
      cpu: '2'
      memory: '6442450944'
    requests:
      cpu: '1'
      memory: '4294967296'

calrissian:
  enabled: True
  storage: 20Gi
  storageClassName: standard
  imagePullSecrets:
    - kaniko-secret

skaffold:
  enabled: False

daskGateway: 
  enabled: False
  daskGatewayUrl: ""
  image: ""

kaniko:
  enabled: False
