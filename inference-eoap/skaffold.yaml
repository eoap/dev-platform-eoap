apiVersion: skaffold/v4beta9
kind: Config
metadata:
  name: eoap-inference
deploy:
  statusCheckDeadlineSeconds: 1200
  helm:
    releases:
    - name: eoap-inference
      chartPath: ../charts/coder
      namespace: eoap-inference
      createNamespace: true
      setValues:
        coder.coderImage: eoepca/pde-code-server:amd64
        coder.workspace: inference-eoap
        coder.storageClassName: standard
        coder.workspaceStorage: 10Gi
        coderResources.limits.cpu: '8'
        coderResources.limits.memory: '24Gi'
        coderResources.requests.cpu: '2'
        coderResources.requests.memory: '8Gi'
        calrissian.enabled: true
        calrissian.storageClassName: standard
        skaffold.enabled: true
      setFiles:
        initScript: ./files/init.sh
        bashrcScript: ./files/bash-rc
        bashloginScript: ./files/bash-login
      valuesFiles:
      - coder-values.yaml
    - name: eoap-inference-s3
      remoteChart: seaweedfs/seaweedfs
      version: 4.48.0
      namespace: eoap-inference
      createNamespace: true
      valuesFiles:
      - seaweedfs-values.yaml
portForward:
- resourceType: service
  resourceName: code-server-service
  namespace: eoap-inference
  port: 8080
  localPort: 8000
