apiVersion: v1
kind: Secret
metadata:
  name: zarr-s3-credentials
type: Opaque
stringData:
  accessKey: {{ .Values.s3.accessKey | quote }}
  secretKey: {{ .Values.s3.secretKey | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zarr-stac-api
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: zarr-stac-api}
  template:
    metadata:
      labels: {app: zarr-stac-api}
    spec:
      securityContext: {runAsUser: 1001, runAsGroup: 100, fsGroup: 100}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: code-server}
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: initialize-index
          image: {{ .Values.stac.image | quote }}
          command: [python, -c]
          args:
            - 'from pathlib import Path; p=Path("{{ .Values.stac.indexPath }}"); p.mkdir(parents=True,exist_ok=True); f=p/"collections.json"; f.write_text("[]") if not f.exists() else None'
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
      containers:
        - name: stac-api
          image: {{ .Values.stac.image | quote }}
          env:
            - name: STAC_FASTAPI_COLLECTIONS_HREF
              value: {{ printf "%s/collections.json" .Values.stac.indexPath | quote }}
          ports: [{name: http, containerPort: 8080}]
          startupProbe:
            httpGet: {path: /collections, port: http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /collections, port: http}
          resources: {{ .Values.stac.resources | toYaml | nindent 12 }}
          volumeMounts:
            - {name: workspace, mountPath: /workspace, readOnly: true}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Values.workspaceClaim }}
---
apiVersion: v1
kind: Service
metadata:
  name: zarr-stac-api
spec:
  selector: {app: zarr-stac-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zarr-publication-settings
data:
  settings.json: |
    {{ dict "endpoint" .Values.s3.endpoint "bucket" .Values.s3.bucket "region" .Values.s3.region "stageOutImage" .Values.stageOutImage | toJson }}
