apiVersion: skaffold/v4beta9
kind: Config
metadata:
  name: zarr-cloud-native-format
deploy:
  helm:
    releases:
    - name: zarr-s3
      remoteChart: seaweedfs/seaweedfs
      version: 4.48.0
      namespace: zarr-cloud-native-format
      createNamespace: true
      valuesFiles:
      - seaweedfs-values.yaml
    - name: zarr-cloud-native-format
      chartPath: ../charts/coder
      namespace: zarr-cloud-native-format
      createNamespace: true
      setValues:
        coder.workspace: zarr-cloud-native-format
        coder.storageClassName: standard
        coder.workspaceStorage: 10Gi
        coderResources.limits.cpu: '2'
        coderResources.limits.memory: '6442450944'
        coderResources.requests.cpu: '1'
        coderResources.requests.memory: '4294967296'
        coder.coderImage: eoepca/pde-code-server:amd64
      setFiles:
        initScript: ./files/init.sh
        bashrcScript: ./files/bash-rc
        bashloginScript: ./files/bash-login
      valuesFiles:
      - coder-values.yaml
    - name: zarr-viewer
      chartPath: ./chart
      namespace: zarr-cloud-native-format
      createNamespace: true
      setFiles:
        clientHtml: ../../zarr-cloud-native-format/examples/titiler-eopf-client.html
      setValueTemplates:
        stac.image: '{{.IMAGE_FULLY_QUALIFIED_eoap_zarr_stac_api}}'
        stageOutImage: '{{.IMAGE_FULLY_QUALIFIED_eoap_zarr_stage_out}}'
  statusCheckDeadlineSeconds: 1200
portForward:
- resourceType: service
  resourceName: code-server-service
  namespace: zarr-cloud-native-format
  port: 8080
  localPort: 8000
- resourceType: service
  resourceName: titiler-eopf
  namespace: zarr-cloud-native-format
  port: 8080
  localPort: 8010
- resourceType: service
  resourceName: titiler-eopf-client
  namespace: zarr-cloud-native-format
  port: 8080
  localPort: 8090
build:
  artifacts:
  - image: eoap-zarr-stac-api
    context: docker/stac-api
    docker:
      dockerfile: Dockerfile
  - image: eoap-zarr-stage-out
    context: ../../mastering-app-package/water-bodies/command-line-tools/stage-out
    docker:
      dockerfile: Dockerfile
  local:
    push: false
