name: build
on:
  push:
    branches:
    - main
    - develop

    paths:
    # Only rebuild website when apps have changed
    - '.github/**'
    - 'advanced-tooling/**'
    - 'dask-gateway/**'
    - 'how-to/**'
    - 'container/**'
jobs:
  

  container-coder:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: build & push image (multi-arch)
      run: |
        cd container/coder
        version=$(cat codemeta.json | jq -r .version )
        IMAGE_ID=ghcr.io/eoap/dev-platform-eoap/eoap-coder
        docker buildx build . \
          --file Dockerfile.coder \
          --platform linux/amd64,linux/arm64 \
          --tag $IMAGE_ID:${version} \
          --push

  container-build:

    #needs: []

    runs-on: ubuntu-latest

    strategy:
      matrix:
        step: ["application-package-patterns", "advanced-tooling", "how-to"]

    steps:
    - uses: actions/checkout@v2
    - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: build & push image
      run: |
        version=$(cat ${{ matrix.step }}/codemeta.json | jq -r .version )
        IMAGE_ID=ghcr.io/eoap/dev-platform-eoap/${{ matrix.step }}-coder
        docker build ${{ matrix.step }} --file ${{ matrix.step }}/Dockerfile.coder --tag ${{ matrix.step }}
        docker tag ${{ matrix.step }} $IMAGE_ID:${version}
        docker push $IMAGE_ID:${version}

  # Dask application/worker images are accepted and published by eoap/dask-app-package.
  # The module uses PDE; do not republish the retired Terradue-fork editor images.
