apiVersion: skaffold/v4beta9
kind: Config
metadata:
  name: eoap-dask-gateway
deploy:
  statusCheckDeadlineSeconds: 2400
  helm:
    releases:
    - name: dask-gateway
      remoteChart: https://helm.dask.org/dask-gateway-2025.4.0.tgz
      namespace: eoap-dask-gateway
      createNamespace: true
      valuesFiles:
      - values.yaml
      setValues:
        traefik.service.type: ClusterIP
    - name: eoap-dask-gateway
      chartPath: ../charts/coder
      namespace: eoap-dask-gateway
      createNamespace: true
      setValues:
        coder.workspace: dask-app-package
        coder.storageClassName: standard
        coder.workspaceStorage: 10Gi
        coder.resources.limits.cpu: '2'
        coder.resources.limits.memory: '6442450944'
        coder.resources.requests.cpu: '1'
        coder.resources.requests.memory: '4294967296'
        calrissian.enabled: true
        calrissian.storageClassName: standard
        skaffold.enabled: true
        daskGateway.enabled: true
        daskGateway.daskGatewayUrl: http://traefik-dask-gateway.eoap-dask-gateway.svc.cluster.local:80
        kaniko.enabled: false
        coder.coderImage: eoepca/pde-code-server:amd64
        coder.podEnvVars:
          - name: DASK_TRAINING_REF
            value: "f428aed638e571368992bc51535ae4ae888f2210"
        daskGateway.image: ghcr.io/eoap/dask-app-package/cloudless-mosaic:2.0.0-rc.69@sha256:6488e09db8294933ffcb0ab79a811ea807b151b5acf1adfbc3dd65d0c5605d74
      setFiles:
        initScript: ./files/init.sh
        bashrcScript: ./files/bash-rc
        bashloginScript: ./files/bash-login
      valuesFiles:
      - coder-values.yaml
    - name: eoap-dask-gateway-s3
      remoteChart: seaweedfs/seaweedfs
      version: 4.48.0
      namespace: eoap-dask-gateway
      createNamespace: true
      valuesFiles:
      - seaweedfs-values.yaml
profiles:
- name: wrs-coverage
  patches:
  - op: add
    path: /deploy/helm/releases/1/setFiles/initScript
    value: ./files/init-wrs-coverage.sh
  - op: add
    path: /deploy/helm/releases/1/setValues/coder.workspace
    value: dask-app-package
- name: eopf-sentinel-2
  patches:
  - op: add
    path: /deploy/helm/releases/1/setFiles/initScript
    value: ./files/init-eopf-sentinel-2.sh
  - op: add
    path: /deploy/helm/releases/1/setValues/coder.workspace
    value: dask-app-package/eopf-sentinel-2
- name: cloudless-mosaic
  patches:
  - op: add
    path: /deploy/helm/releases/1/setFiles/initScript
    value: ./files/init-cloudless-mosaic.sh
  - op: add
    path: /deploy/helm/releases/1/setValues/coder.workspace
    value: dask-app-package/cloudless-mosaic
portForward:
- resourceType: service
  resourceName: code-server-service
  namespace: eoap-dask-gateway
  address: localhost
  port: 8080
  localPort: 8000
- resourceType: service
  resourceName: traefik-dask-gateway
  namespace: eoap-dask-gateway
  address: localhost
  port: 80
  localPort: 8001
