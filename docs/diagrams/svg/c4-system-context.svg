<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1308px;height:528px;background:#FFFFFF;" width="1308px" height="528px" viewBox="0 0 1308 528" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="475.698" y="24.966" fill="#000" font-size="14" textLength="350.258" font-weight="700">C4 Level 1: EOAP learning platform system context</text></g><!--entity Learner--><g class="entity" data-qualified-name="Learner" id="ent0001" data-source-line="4"><rect x="320" y="52.068" width="262.871" height="77.204" fill="#D5E9EF" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="413.44" y="77.034" fill="#000" font-size="14" textLength="75.992">Self-learner</text><text x="423.842" y="96.102" fill="#000" font-size="14" textLength="55.188">[Person]</text><text x="330" y="115.17" fill="#000" font-size="14" textLength="242.871">Studies and executes EOAP exercises</text></g><!--entity Developer--><g class="entity" data-qualified-name="Developer" id="ent0002" data-source-line="5"><rect x="601.5" y="52.068" width="284.277" height="77.204" fill="#D5E9EF" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="683.908" y="77.034" fill="#000" font-size="14" textLength="119.462">Module developer</text><text x="716.045" y="96.102" fill="#000" font-size="14" textLength="55.188">[Person]</text><text x="611.5" y="115.17" fill="#000" font-size="14" textLength="264.277">Authors courses and verifies acceptance</text></g><!--entity Platform--><g class="entity" data-qualified-name="Platform" id="ent0003" data-source-line="6"><rect x="446" y="188.068" width="303.303" height="96.272" fill="#B9DCDD" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="471.547" y="213.034" fill="#000" font-size="14" textLength="252.209">EOAP learning and validation platform</text><text x="538.649" y="232.102" fill="#000" font-size="14" textLength="118.006">[Software system]</text><text x="456" y="251.17" fill="#000" font-size="14" textLength="283.303">Provides reproducible browser workspaces</text><text x="473.605" y="270.238" fill="#000" font-size="14" textLength="248.093">and module-specific execution checks</text></g><!--entity Training--><g class="entity" data-qualified-name="Training" id="ent0004" data-source-line="7"><rect x="6" y="343.068" width="268.961" height="96.272" fill="#EEE" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="72.084" y="368.034" fill="#000" font-size="14" textLength="136.793">Training repositories</text><text x="53.128" y="387.102" fill="#000" font-size="14" textLength="174.705">[External software system]</text><text x="16" y="406.17" fill="#000" font-size="14" textLength="248.961">Course source, notebooks, typed CWL</text><text x="76.907" y="425.238" fill="#000" font-size="14" textLength="127.148">and reference tests</text></g><!--entity Artifacts--><g class="entity" data-qualified-name="Artifacts" id="ent0005" data-source-line="8"><rect x="293" y="343.068" width="303.373" height="96.272" fill="#EEE" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="392.733" y="368.034" fill="#000" font-size="14" textLength="103.908">Artifact services</text><text x="357.334" y="387.102" fill="#000" font-size="14" textLength="174.705">[External software system]</text><text x="303" y="406.17" fill="#000" font-size="14" textLength="283.373">Registries, release assets, Python packages</text><text x="373.252" y="425.238" fill="#000" font-size="14" textLength="142.869">and editor extensions</text></g><!--entity Data--><g class="entity" data-qualified-name="Data" id="ent0006" data-source-line="9"><rect x="642" y="343.068" width="219.261" height="96.272" fill="#EEE" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="697.731" y="368.034" fill="#000" font-size="14" textLength="107.8">EO data services</text><text x="664.278" y="387.102" fill="#000" font-size="14" textLength="174.705">[External software system]</text><text x="660.673" y="406.17" fill="#000" font-size="14" textLength="181.915">STAC catalogs, imagery and</text><text x="652" y="425.238" fill="#000" font-size="14" textLength="199.261">authenticated acquisition APIs</text></g><!--entity Kubernetes--><g class="entity" data-qualified-name="Kubernetes" id="ent0007" data-source-line="10"><rect x="879" y="343.068" width="276.507" height="96.272" fill="#EEE" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="955.318" y="368.034" fill="#000" font-size="14" textLength="123.872">Kubernetes cluster</text><text x="921.165" y="387.102" fill="#000" font-size="14" textLength="192.177">[External execution platform]</text><text x="889" y="406.17" fill="#000" font-size="14" textLength="256.507">Supplies scheduling, storage and RBAC</text><text x="911.407" y="425.238" fill="#000" font-size="14" textLength="211.693">Minikube is the tested local host</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-link-type="dependency"><polygon points="520.383,187.96,515.847,179.218,516.476,184.839,510.855,185.468,520.383,187.96" fill="#0F4C5C" style="stroke:#0F4C5C;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M470.752,129.431 C478.81,143.15 488.99,158.179 500.5,170.068 C506.563,176.331 509.42,179.203 516.476,184.839" style="stroke:#0F4C5C;stroke-width:2;" fill="none"/><text x="502.5" y="164.034" fill="#000" font-size="14" textLength="217.447">follows courses; inspects outputs</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="703.5,187.928,713.001,185.335,707.373,184.766,707.942,179.138,703.5,187.928" fill="#0F4C5C" style="stroke:#0F4C5C;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M739.328,129.228 C736.233,143.237 730.852