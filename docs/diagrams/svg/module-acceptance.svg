<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:822px;height:1290px;background:#FFFFFF;" width="822px" height="1290px" viewBox="0 0 822 1290" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="267.467" y="34.966" fill="#000" font-size="14" textLength="285.543" font-weight="700">Acceptance of a named module snapshot</text></g><ellipse cx="347.861" cy="65.068" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="214.066" y="95.068" width="267.589" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="224.066" y="120.034" fill="#000" font-size="14" textLength="247.589">Record training + deployment source,</text><text x="235.413" y="139.102" fill="#000" font-size="14" textLength="224.895">images, target cluster and dataset</text><rect x="210.342" y="173.204" width="275.037" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="220.342" y="198.17" fill="#000" font-size="14" textLength="255.037">Verify configuration, source availability</text><text x="237.751" y="217.238" fill="#000" font-size="14" textLength="220.219">and module-specific quality gates</text><rect x="238.216" y="251.34" width="219.289" height="39.068" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="248.216" y="276.306" fill="#000" font-size="14" textLength="199.289">Deploy and check initialization</text><rect x="212.708" y="310.408" width="270.305" height="39.068" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="222.708" y="335.373" fill="#000" font-size="14" textLength="250.305">Run editor HTTP and S3 smoke checks</text><rect x="236.599" y="369.475" width="222.523" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="246.599" y="394.441" fill="#000" font-size="14" textLength="202.523">Validate distributed typed CWL</text><text x="247.145" y="413.509" fill="#000" font-size="14" textLength="201.431">and generated documentation</text><rect x="204.553" y="447.611" width="286.615" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="214.553" y="472.577" fill="#000" font-size="14" textLength="266.615">Execute the complete learning sequence</text><text x="244.303" y="491.645" fill="#000" font-size="14" textLength="207.115">plus specialized runtime checks</text><polygon points="274.277,525.747,421.444,525.747,433.444,537.747,421.444,549.747,274.277,549.747,262.277,537.747,274.277,525.747" fill="#FFF2D5" style="stroke:#956716;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="274.277" y="543.179" fill="#000" font-size="14" textLength="147.167">Required checks pass?</text><text x="240.535" y="533.645" fill="#000" font-size="14" textLength="21.742">yes</text><text x="433.444" y="533.645" fill="#000" font-size="14" textLength="17.122">no</text><rect x="16" y="559.747" width="250.509" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="56.156" y="584.713" fill="#000" font-size="14" textLength="170.197">Inspect output semantics,</text><text x="26" y="603.781" fill="#000" font-size="14" textLength="230.509">readability and scientific assertions</text><polygon points="479,559.747,629.933,559.747,641.933,571.747,629.933,583.747,479,583.747,467,571.747,479,559.747" fill="#FFF2D5" style="stroke:#956716;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="479" y="577.179" fill="#000" font-size="14" textLength="150.933">Fixable module defect?</text><text x="445.258" y="567.645" fill="#000" font-size="14" textLength="21.742">yes</text><text x="641.933" y="567.645" fill="#000" font-size="14" textLength="106.358">external blocker</text><rect x="296.509" y="593.747" width="252.931" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="345.079" y="618.713" fill="#000" font-size="14" textLength="155.791">Fix on a feature branch;</text><text x="306.509" y="637.781" fill="#000" font-size="14" textLength="232.931">synchronize the deployed snapshot</text><rect x="312.553" y="671.883" width="220.843" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="352.723" y="696.849" fill="#000" font-size="14" textLength="140.503">Rerun affected gates;</text><text x="322.553" y="715.917" fill="#000" font-size="14" textLength="200.843">record only their actual results</text><rect x="569.44" y="593.747" width="233.037" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="579.44" y="618.713" fill="#000" font-size="14" textLength="213.037">Record blocked / skipped checks</text><text x="588.792" y="637.781" fill="#000" font-size="14" textLength="194.333">and preserve failure evidence</text><ellipse cx="685.959" cy="682.883" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="685.959" cy="682.883" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="417.06" y="750.019" width="274.813" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="455.907" y="774.985" fill="#000" font-size="14" textLength="197.119">Resume acceptance only after</text><text x="427.06" y="794.053" fill="#000" font-size="14" textLength="254.813">required gates and output checks pass</text><polygon points="347.861,814.155,359.861,826.155,347.861,838.155,335.861,826.155,347.861,814.155" fill="#FFF2D5" style="stroke:#956716;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="244.992" y="858.155" width="205.737" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="254.992" y="883.121" fill="#000" font-size="14" textLength="185.737">Finish workloads and export</text><text x="285.113" y="902.188" fill="#000" font-size="14" textLength="125.496">wanted S3 artifacts</text><rect x="206.219" y="936.29" width="283.283" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="266.339" y="961.256" fill="#000" font-size="14" textLength="163.043">Run lifecycle acceptance;</text><text x="216.219" y="980.324" fill="#000" font-size="14" textLength="263.283">verify retained files + fresh environment</text><rect x="220.184" y="1014.426" width="255.353" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="265.317" y="1039.392" fill="#000" font-size="14" textLength="165.087">Verify fresh reproduction</text><text x="230.184" y="1058.46" fill="#000" font-size="14" textLength="235.353">when setup or distribution changed</text><rect x="231.013" y="1092.562" width="233.695" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="241.013" y="1117.528" fill="#000" font-size="14" textLength="213.695">Record evidence and limitations;</text><text x="261.754" y="1136.596" fill="#000" font-size="14" textLength="172.213">commit reviewed changes</text><rect x="223.621" y="1170.698" width="248.479" height="58.136" fill="#E3F2F3" style="stroke:#0F4C5C;stroke-width:0.5;" rx="5" ry="5"/><text x="233.621" y="1195.664" fill="#000" font-size="14" textLength="228.479">Publish source / images separately</text><text x="259.738" y="1214.732" fill="#000" font-size="14" textLength="176.245">when release is authorized</text><ellipse cx="347.861" cy="1259.834" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="347.861" cy="1259.834" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="347.861" y1="75.068" x2="347.861" y2="95.068" style="stroke:#0F4C5C;stroke-width:2;"/><polygon points="343.861,85.068,347.861,